 const list=schools.filter(s=>(!area||s.areas.includes(area))&&(!$('type').value||s.type===$('type').value)&&(!max||(s.grade!==null&&s.grade<=Number(max)))&&(!$('photos').checked||s.photo||uniformDocuments[s.name])&&(!saved||favorites.has(s.id))&&[s.name,s.name+'高校',s.course,s.life,s.uniform,...s.areas].join(' ').toLowerCase().includes(query));
 const point=s=>Number(String(s.score).split('～').at(-1));
 if($('sort').value==='hensachi')list.sort((x,y)=>point(y)-point(x));
 if($('sort').value==='grade')list.sort((x,y)=>(x.grade??99)-(y.grade??99));
 $('count').textContent=list.length+'件の学科・コース';
 $('compareButton').textContent='比較（'+compared.size+'/3）';
 $('areas').innerHTML=areaOptions.map((name,i)=>'<button data-area="'+i+'" aria-pressed="'+(area===name)+'">'+(name||'すべて')+'</button>').join('');
 $('results').innerHTML=list.map(s=>'<article class="card"><div class="meta">'+s.type+' · '+s.areas.join('／')+'</div><h2>'+s.name+'高校</h2><p class="small">'+s.course+'</p><div class="metrics"><span>偏差値<b>'+s.score+'</b></span><span>内申の目安<b>'+gradeText(s)+'</b></span></div><p>'+s.life+'</p><p class="uniform">'+s.uniform+'</p><div class="actions"><button data-detail="'+s.id+'">'+(s.photo||uniformDocuments[s.name]?'詳細・制服':'詳細')+'</button><button aria-label="'+s.name+' '+s.course+'をお気に入り" aria-pressed="'+favorites.has(s.id)+'" data-save="'+s.id+'">'+(favorites.has(s.id)?'★':'☆')+'</button><button aria-label="'+s.name+' '+s.course+'を比較" aria-pressed="'+compared.has(s.id)+'" data-compare="'+s.id+'">比較</button></div></article>').join('')||'<p>条件に合う高校がありません。絞り込みを変えて探してみよう。</p>';
 if(!$('comparison').hidden)renderCompare();
}
function comparisonValue(s,key){
 const data=outcomeFor(s);
 if(key==='progressRate'||key==='universityRate'){
  if(!data)return '算出できる資料を未確認';
  const rate=key==='progressRate'?outcomeRate(data):rateText(data.university,data.total);
  return rate+'（'+(data.year||2026)+'年3月・'+(data.scope||s.course)+'）';
 }
 if(key==='benefit'||key==='watch')return fitFor(s)[key==='benefit'?0:1];
 return s[key];
}
function outcomeSection(s){
 const data=outcomeFor(s);
 if(!data){
  const [url,summary]=careerSources[s.name]||[];
  return '<p>進学率を算出できる資料は未確認です。</p>'+(summary?'<p>'+summary+'</p><p>'+link(url,'進路情報の出典')+'</p>':'');
 }
 const counts='大学 '+data.university+'人 ／ 短大 '+data.junior+'人 ／ 専修・専門等 '+data.vocational+'人'+(data.otherStudy?' ／ 準大学・短大 '+data.otherStudy+'人':'');
 return '<p class="small">'+(data.year||2026)+'年3月卒業・'+(data.scope||s.course)+'</p><div class="metrics"><span>進学率<b>'+outcomeRate(data)+'</b></span><span>大学進学率<b>'+rateText(data.university,data.total)+'</b></span></div><p>'+counts+'</p><p class="small">'+(data.publishedBreakdown?'公開進路表の人数合計':'卒業者数')+' '+data.total+'人を分母に計算。進学率には短大・専門等も含みます。大学進学率は大学に進んだ人数の割合です。</p><p>'+link(data.source,'進路データの出典')+'</p>';
}
function renderCompare(){
 const selected=[...compared].map(id=>schools[id]);
 const fields=[['学科・コース','course'],['偏差値','score'],['内申の目安','grade'],['学校生活','life'],['進学率','progressRate'],['大学進学率','universityRate'],['メリット','benefit'],['注意点','watch'],['制服','uniform'],['数値の出典','note']];
 $('comparison').innerHTML='<h2>高校比較</h2>'+(selected.length?'<table><thead><tr><th scope="col">項目</th>'+selected.map(s=>'<th scope="col">'+s.name+'高校</th>').join('')+'</tr></thead><tbody>'+fields.map(([title,key])=>'<tr><th scope="row">'+title+'</th>'+selected.map(s=>'<td>'+(comparisonValue(s,key)??'公表値未確認')+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p>高校カードの「比較」を押すと、最大3件を並べて見られます。</p>');
}
function openDetail(s){
 const profile=profiles[s.name]||{};
 const courseValue=value=>typeof value==='string'?value:value?.[s.course];
 const map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('愛知県 '+schoolLabel(s));
 const related=schools.filter(item=>item.name===s.name&&item.id!==s.id);
 const sections=[
  ['study','学び・学校生活','<p>'+s.life+'</p>'+(courseValue(profile.study)?'<p>'+courseValue(profile.study)+'</p>':'')+(related.length?'<p>同じ高校の学科・コース</p><div class="actions">'+related.map(item=>'<button data-detail="'+item.id+'">'+item.course+'</button>').join('')+'</div>':'')],
  ['outcomes','卒業後の進路',outcomeSection(s)],
  ['fit','メリット・注意点','<p><strong>メリット</strong>　'+fitFor(s)[0]+'</p><p><strong>注意点</strong>　'+fitFor(s)[1]+'</p>'],
  ['access','通学・アクセス',(profile.access?'<p>'+profile.access+'</p>':'')+'<p>'+link(map,'地図で自宅からの経路を調べる')+(profile.route?' ／ '+link(profile.route,'アクセスの出典'):'')+'</p>'],
  ['exam','2027年春入試',(courseValue(profile.exam)?'<p>'+courseValue(profile.exam)+'</p>':'')+(admissionDetails[s.name]?'<p>'+admissionDetails[s.name][0]+' '+link(admissionDetails[s.name][1],'募集学科・コースの出典')+'</p>':'')+'<p>'+s.note+' '+link(s.source,'偏差値・内申の出典')+'</p>'+(s.type==='公立'?'<p>評定得点は中3の9教科の内申合計（45点満点）×2。一般選抜の当日点も合わせて使います。</p><p>'+link(admissionGuide,'愛知県の入試要項')+'</p>':'')],
  ['uniform','制服',uniformSection(s)]
 ];
 const references=[...(profile.site?[['学校公式サイト',profile.site]]:[]),...(profile.links||[])];
 if(references.length)sections.push(['sources','もっと知りたいとき','<ul>'+references.map(([label,url])=>'<li>'+link(url,label)+'</li>').join('')+'</ul>']);
 $('detailBody').innerHTML='<p class="meta">'+s.type+' · '+s.areas.join('／')+'</p><h2 id="detailTitle">'+schoolLabel(s)+'</h2><p>'+s.course+'</p><div class="metrics"><span>偏差値<b>'+s.score+'</b></span><span>内申の目安<b>'+gradeText(s)+'</b></span></div><nav class="detail-nav" aria-label="学校詳細の目次">'+sections.map(([id,title])=>'<a href="#detail-'+id+'">'+title+'</a>').join('')+'</nav>'+sections.map(([id,title,content])=>'<section class="detail-section" id="detail-'+id+'" tabindex="-1"><h3>'+title+'</h3>'+content+'</section>').join('');
 if(!$('detail').open)$('detail').showModal();
 $('detail').scrollTop=0;
}
$('detail').addEventListener('click',event=>{
 const anchor=event.target.closest('.detail-nav a');
 if(!anchor)return;
 event.preventDefault();
 const section=$(anchor.hash.slice(1));
 section.focus({preventScroll:true});
 section.scrollIntoView({block:'nearest'});
});
document.addEventListener('error',event=>{if(event.target.tagName==='IMG'){const replacement=document.createElement('span');replacement.textContent='掲載元で写真を見る';event.target.replaceWith(replacement);}},true);
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-area],[data-detail],[data-save],[data-compare]');
 if(!button)return;
 const {area:areaId,detail,save,compare}=button.dataset;
 if(areaId!==undefined){area=areaOptions[Number(areaId)];render();$('areas').querySelector('[aria-pressed=true]').focus();}
 if(detail!==undefined){event.preventDefault();openDetail(schools[detail]);}
 if(save!==undefined){const id=Number(save);favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('chita-favorites',JSON.stringify([...favorites]));}catch{}render();document.querySelector('[data-save="'+id+'"]')?.focus();}
 if(compare!==undefined){const id=Number(compare);if(compared.has(id))compared.delete(id);else if(compared.size<3)compared.add(id);else{$('status').textContent='比較は3件までです。選択中の高校を1件外してください。';return;}$('status').textContent='';render();document.querySelector('[data-compare="'+id+'"]')?.focus();}
});
$('onlySaved').onclick=()=>{saved=!saved;$('onlySaved').setAttribute('aria-pressed',saved);render();};
$('compareButton').onclick=()=>{$('comparison').hidden=!$('comparison').hidden;if(!$('comparison').hidden)renderCompare();};
$('closeDetail').onclick=()=>$('detail').close();
$('query').oninput=render;
for(const id of ['type','grade','sort','photos'])$(id).onchange=render;
render();
</script></body></html>
